[package]
name = "blackberrylabs"
description = "Blackberrylabs — everything your AI agents do to your machine, on one screen. Read-only, like the tools behind it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "bbl-app"
path = "src/main.rs"

[dependencies]
bbl-core = { path = "../core" }
bbl-report.workspace = true
iced = { version = "=0.13.1", features = ["tokio"] }
bbl-ui = { git = "https://github.com/blackberrylabs/bbl-ui", tag = "v0.1.0" }
serde.workspace = true
serde_json.workspace = true

# ---------------------------------------------------------------- packaging
# `packaging/build.sh` builds the workspace once, then runs `cargo deb --no-build` and
# `cargo generate-rpm` from here, so one package ships both binaries.

[package.metadata.deb]
name = "blackberrylabs"
maintainer = "Alexandre Do <alexandre@blackberrylabs.dev>"
copyright = "2026, Alexandre Do"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Blackberrylabs is the control tower of a small family of read-only tools for developers \
who run AI on Linux: Cleanator (what AI tooling left on the disk), MCProster (every MCP \
server declared on the machine) and Permitt (what each AI assistant may do without asking). \
It launches the installed modules, reads their reports and shows their findings in one \
list, most serious first, with what the person could do and the button that opens the \
module there. It changes nothing on the machine. Ships the desktop app (bbl-app) and the \
command line (bbl)."""
section = "devel"
priority = "optional"
depends = "$auto, libxkbcommon0, libwayland-client0 | libx11-6"
recommends = "libvulkan1, mesa-vulkan-drivers, cleanator, mcproster, permitt"
assets = [
    ["target/release/bbl-app", "usr/bin/", "755"],
    ["target/release/bbl", "usr/bin/", "755"],
    ["../../assets/blackberrylabs.desktop", "usr/share/applications/", "644"],
    ["../../assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/blackberrylabs.svg", "644"],
    ["../../assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/blackberrylabs.png", "644"],
    ["../../assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/blackberrylabs.png", "644"],
    ["../../assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/blackberrylabs.png", "644"],
    ["../../assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/blackberrylabs.png", "644"],
    ["../../assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/blackberrylabs.png", "644"],
    ["../../assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/blackberrylabs.png", "644"],
    ["../../assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/blackberrylabs.png", "644"],
    ["../../README.md", "usr/share/doc/blackberrylabs/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "blackberrylabs"
summary = "Everything your AI agents do to your machine, on one screen"
license = "MIT"
url = "https://github.com/blackberrylabs/blackberrylabs"
requires = { libxkbcommon = "*" }
assets = [
    { source = "target/release/bbl-app", dest = "/usr/bin/bbl-app", mode = "755" },
    { source = "target/release/bbl", dest = "/usr/bin/bbl", mode = "755" },
    { source = "assets/blackberrylabs.desktop", dest = "/usr/share/applications/blackberrylabs.desktop", mode = "644" },
    { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/blackberrylabs.svg", mode = "644" },
    { source = "assets/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/blackberrylabs.png", mode = "644" },
    { source = "assets/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/blackberrylabs.png", mode = "644" },
    { source = "assets/icon-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/blackberrylabs.png", mode = "644" },
    { source = "assets/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/blackberrylabs.png", mode = "644" },
    { source = "assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/blackberrylabs.png", mode = "644" },
    { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/blackberrylabs.png", mode = "644" },
    { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/blackberrylabs.png", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/blackberrylabs/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/blackberrylabs/LICENSE", mode = "644", doc = true },
]
