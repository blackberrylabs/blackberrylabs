# A Blackberrylabs module sheet: how the tower finds, launches and presents one module.
# Declarative only — the tower holds no code specific to a module (rule R5).

id = "linstruct"
name = "Linstruct"
verb = "lint"
tagline = "Your AI instruction files, as each agent will actually read them"
description = "For each AI host on the machine and each project, the stack of instruction files the host would load (CLAUDE.md, AGENTS.md, .cursor/rules…) — in its order, references expanded, budget simulated — and what it would cut, ignore or shadow. Nineteen hosts, every rule sourced."
cli = "linstruct"
app = "linstruct-app"
report = ["report"]
timeout_s = 120
schema = "bbl-report/1"
home = "https://github.com/blackberrylabs/linstruct"
releases = "https://github.com/blackberrylabs/linstruct/releases"
