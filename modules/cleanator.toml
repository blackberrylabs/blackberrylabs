# A Blackberrylabs module sheet: how the tower finds, launches and presents one module.
# Declarative only — the tower holds no code specific to a module (rule R5).

id = "cleanator"
name = "Cleanator"
verb = "clean"
tagline = "Disk cleaner for developers who run AI on Linux — never deletes anything"
description = "Scans a home directory, recognises what AI tooling leaves behind (model stores, caches, build outputs, abandoned environments) and proposes what could go — as a script you read and run yourself."
cli = "cleanator-cli"
app = "cleanator"
report = ["report", "--no-probes"]
# A full disk scan takes a while; the default limit would cut it short.
timeout_s = 900
schema = "bbl-report/1"
home = "https://github.com/blackberrylabs/cleanator"
releases = "https://github.com/blackberrylabs/cleanator/releases"
