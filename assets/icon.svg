<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Blackberrylabs: the control tower — a dark tile, a radar sweep, and the four
       severities as four dots from the centre out: orange, amber, green, grey. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3440"/>
      <stop offset="1" stop-color="#1b2029"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>
  <g fill="none" stroke="#f4f6f9" stroke-opacity="0.22" stroke-width="10">
    <circle cx="256" cy="256" r="72"/>
    <circle cx="256" cy="256" r="128"/>
    <circle cx="256" cy="256" r="184"/>
  </g>
  <!-- the sweep -->
  <path d="M256 256 L256 72 A184 184 0 0 1 415 164 Z" fill="#f4f6f9" fill-opacity="0.12"/>
  <line x1="256" y1="256" x2="256" y2="72" stroke="#f4f6f9" stroke-width="10" stroke-linecap="round"/>
  <!-- the four severities, from the centre out -->
  <circle cx="256" cy="256" r="26" fill="#eb6834"/>
  <circle cx="188" cy="318" r="18" fill="#b98400"/>
  <circle cx="356" cy="330" r="18" fill="#2fa32f"/>
  <circle cx="130" cy="190" r="16" fill="#9aa3b2"/>
</svg>
